[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data"
version = "0.1.0"
description = "Proyecto de datos con migraciones de BD. Uno único para api, workers, etc. (modelos + sesión + migraciones)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3,<1.14.0",
    "pgvector>=0.3.6,<0.4.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "sqlalchemy>=2.0.13,<2.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
