[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contracts"
version = "0.1.0"
description = "Contratos de DTOs y Eventos compartidos"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0"
]

[tool.setuptools.packages.find]
where = ["src"]
