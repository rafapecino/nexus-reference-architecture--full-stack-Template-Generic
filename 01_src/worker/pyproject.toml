[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worker"
version = "0.1.0"
description = "Worker base reutilizable para procesos asincronos"
requires-python = ">=3.12"
dependencies = [
    "contracts>=0.1.0",
    "data>=0.1.0",
    "common>=0.1.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
