services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0"]
    ports:
      - "10000:10000"   # blob
      - "10001:10001"   # queue
      - "10002:10002"   # table
    volumes: [azuresto_data:/data]

  api:
    container_name: baseue_api
    build:
      context: .
      dockerfile: 01_src/api/Dockerfile
    env_file:
      - .env
      - 01_src/api/.env.local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    container_name: baseue_worker
    build:
      context: .
      dockerfile: 01_src/worker/Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
   postgres_data:
   azuresto_data:

