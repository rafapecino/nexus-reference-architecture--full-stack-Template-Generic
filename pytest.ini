[pytest]
minversion = 9.0
testpaths = 07_tests
addopts =
    -ra
    -q
    --strict-markers
markers =
    unit: unit tests (no docker, no red)
    integration: integration tests (docker/db/storage)
    slow: slow tests
filterwarnings =
    error
    # fallan los test por el cambio de python-multipart a python_multipart
    ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning
